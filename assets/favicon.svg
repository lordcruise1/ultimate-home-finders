<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Icon Mark U with House & Pin inside -->
  <g transform="translate(15, 10)">
    <!-- Outer Red U -->
    <path d="M 30 20 
             C 30 8, 52 8, 52 20 
             L 52 115 
             C 52 155, 118 155, 118 115 
             L 118 20 
             C 118 8, 140 8, 140 20 
             L 140 115 
             C 140 180, 30 180, 30 115 
             Z" 
          fill="#B7242F"/>
    
    <!-- House Outline inside U -->
    <polygon points="85,32 50,75 120,75" fill="none" stroke="#8B1620" stroke-width="5" stroke-linejoin="round"/>
    <rect x="54" y="75" width="62" height="52" rx="4" fill="none" stroke="#8B1620" stroke-width="5"/>
    
    <!-- Two Windows -->
    <rect x="62" y="85" width="12" height="12" rx="1.5" fill="#8B1620"/>
    <rect x="96" y="85" width="12" height="12" rx="1.5" fill="#8B1620"/>
    
    <!-- Central Location Pin -->
    <path d="M 85 96 C 80 96, 76 100, 76 105 C 76 114, 85 124, 85 124 C 85 124, 94 114, 94 105 C 94 100, 90 96, 85 96 Z" fill="#8B1620"/>
  </g>
</svg>
